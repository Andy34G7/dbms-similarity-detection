services:
  postgres-db:
    image: pgvector/pgvector:pg16
    container_name: postgres-exam-lab
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: exam_eval_db
    ports:
      - "5433:5432"
    volumes:
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_triggers_procedures.sql:/docker-entrypoint-initdb.d/02_triggers_procedures.sql:ro
      - ./database/03_views.sql:/docker-entrypoint-initdb.d/03_views.sql:ro
      - ./database/04_seed.sql:/docker-entrypoint-initdb.d/04_seed.sql:ro
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
